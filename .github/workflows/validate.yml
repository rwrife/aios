name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh
      - name: Check pinned ChatGPT runtime without account credentials
        run: |
          python3 scripts/stage-codex.py /tmp/aios-codex-download /tmp/aios-codex-stage
          PATH="/tmp/aios-codex-stage/usr/local/bin:$PATH" AIOS_CODEX_SMOKE=1 PYTHONPATH=apps python3 -m unittest discover -s tests -p test_subscription.py -v
  identity-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable disposable encrypted-volume test support
        run: sudo modprobe dm_crypt && sudo modprobe loop
      - name: Permit bubblewrap user namespaces on the Ubuntu test host
        run: sudo apparmor_parser -r scripts/qa/aios-bwrap.apparmor
      - name: Test real namespaces, process teardown and encrypted workspaces
        run: bash scripts/test-identity-linux.sh
      - name: Show kernel sandbox denials on failure
        if: failure()
        run: sudo dmesg | tail -n 60
  identity-display:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Permit disposable bubblewrap user namespaces
        run: sudo apparmor_parser -r scripts/qa/aios-bwrap.apparmor
      - name: Test rendered private surfaces, PIN input and display socket isolation
        run: bash scripts/test-identity-display.sh
  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build.sh
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Boot offline with BIOS and UEFI
        run: |
          iso=$(find distro/alpine/out -name '*-x86_64.iso' -print -quit)
          sudo python3 scripts/test-boot.py "$iso" --timeout 600 --log distro/alpine/out/boot-bios.log
          sudo python3 scripts/test-boot.py "$iso" --uefi /usr/share/OVMF/OVMF_CODE_4M.fd --timeout 600 --log distro/alpine/out/boot-uefi.log
      - uses: actions/upload-artifact@v4
        with:
          name: aios-x86_64
          path: distro/alpine/out/*

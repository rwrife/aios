# AIOS keeps compositing deliberately small: no shadows, fades, or animation.
# Picom clips the complete Openbox frame, including its one-pixel border, for
# the two native surfaces that use rounded desktop chrome. Only the terminal
# is translucent; the browser and all other surfaces remain opaque.
backend = "xrender";
vsync = true;
shadow = false;
fading = false;
frame-opacity = 1.0;

rules: ({
  match = "class_g = 'AIOS-Terminal'";
  opacity = 0.92;
  corner-radius = 16;
}, {
  match = "class_i = 'aios-browser'";
  corner-radius = 16;
});

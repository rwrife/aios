# AIOS keeps compositing deliberately small: no shadows, fades, or animation.
# Only the terminal surface is translucent; native Qt windows retain their
# own opaque theme surfaces and text remains high contrast.
backend = "xrender";
vsync = true;
shadow = false;
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "92:class_g = 'AIOS-Terminal'"
];

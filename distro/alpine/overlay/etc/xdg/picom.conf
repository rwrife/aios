# AIOS keeps compositing deliberately small: no shadows, fades, or animation.
# Native frames stay square so their thin borders remain intact on both backends.
# Only the terminal is translucent; other surfaces remain opaque.
backend = "glx";
# Damage-only repainting leaves newly opened software-rendered Qt surfaces blank.
use-damage = false;
vsync = true;
shadow = false;
fading = false;
frame-opacity = 1.0;
corner-radius = 0;

rules: ({
  match = "class_g = 'AIOS-Terminal'";
  opacity = 0.92;
});

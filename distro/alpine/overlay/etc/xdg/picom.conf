# AIOS keeps compositing deliberately small: no shadows, fades, or animation.
# The GLX renderer carries the one-pixel border around antialiased corners;
# XRender only clips the rectangular frame and leaves gaps in the outline.
# Only the terminal is translucent; other surfaces remain opaque.
backend = "glx";
# Damage-only repainting leaves newly opened software-rendered Qt surfaces blank.
use-damage = false;
vsync = true;
shadow = false;
fading = false;
frame-opacity = 1.0;

rules: ({
  match = "class_g = 'AIOS-Terminal'";
  opacity = 0.92;
  corner-radius = 16;
}, {
  match = "class_i = 'aios-browser'";
  corner-radius = 16;
});
